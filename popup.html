<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Scriptrail</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">
    <header class="popup-header">
      <span class="sr-wordmark">
        <img src="icons/icon128.png" alt="" width="20" height="20" class="sr-icon" />
        Script<em>rail</em>
      </span>
      <button id="themeToggleBtn" class="btn btn-ghost btn-icon" title="Toggle light / dark" aria-label="Toggle theme">🌙</button>
    </header>

    <div class="popup-trail" aria-hidden="true">
      <svg viewBox="0 0 320 46" preserveAspectRatio="none" width="100%" height="46">
        <path class="trail-path" d="M0 34 C 30 10, 55 40, 85 22 S 145 6, 175 26 S 235 42, 265 18 S 305 8, 320 20"
              fill="none" stroke="var(--border-strong)" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 7"/>
        <circle class="wp wp-1" cx="0" cy="34" r="4" fill="var(--pine)"/>
        <circle class="wp wp-2" cx="150" cy="18" r="4" fill="var(--blaze)"/>
        <circle class="wp wp-3" cx="320" cy="20" r="5" fill="var(--blaze)"/>
      </svg>
    </div>

    <div class="popup-body">
      <label class="option-row" for="toggleCheckbox">
        <div class="option-text">
          <span class="option-title">Show button</span>
          <span class="option-sub">"View Report" in the Docs toolbar</span>
        </div>
        <span class="switch">
          <input type="checkbox" id="toggleCheckbox" />
          <span class="track"></span><span class="thumb"></span>
        </span>
      </label>

      <hr class="trail-rule" />

      <label class="option-row" for="infobarCheckbox">
        <div class="option-text">
          <span class="option-title">Show stats bar</span>
          <span class="option-sub">Floating writing-time panel in the doc</span>
        </div>
        <span class="switch">
          <input type="checkbox" id="infobarCheckbox" />
          <span class="track"></span><span class="thumb"></span>
        </span>
      </label>
    </div>

    <footer class="popup-footer">
      <button id="openSettingsBtn" class="footer-link">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Settings
      </button>
      <span class="footer-version">v1.0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
