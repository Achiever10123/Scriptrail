<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scriptrail</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="popup-root">

      <div class="brand">
        <img src="icons/icon128.png" alt="Scriptrail" class="brand-icon" />
        <h1 class="brand-name">Scriptrail</h1>
      </div>

      <hr class="divider" />

      <p class="subtitle">Writing analytics for Google Docs.</p>

      <div class="toggle-row">
        <span class="toggle-label">Show Report Button</span>
        <label class="switch">
          <input type="checkbox" id="toggleCheckbox" checked />
          <span class="slider"></span>
        </label>
      </div>

      <p class="hint">
        Open any Google Doc and click <strong>View Report</strong> in the toolbar.
      </p>

    </div>
    <script src="popup.js"></script>
  </body>
</html>
